server.port=8080
spring.application.name=disaster-relief-backend

# Database configuration (Auto-detects H2 vs MySQL based on jdbc URL)
spring.datasource.url=jdbc:h2:mem:disaster_relief_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=DisasterReliefSuperSecretSigningKeyForJwtTokens2026MustBeAtLeast32BytesLong
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000